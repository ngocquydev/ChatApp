services:
  # ============================================================================
  # 1. Cơ sở dữ liệu & Bộ nhớ đệm (Databases & Caches)
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: chat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat_network

  mongo:
    image: mongo:latest
    container_name: chat_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chat_network

  neo4j:
    image: neo4j:5-community
    container_name: chat_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
    networks:
      - chat_network

  # ============================================================================
  # 2. Máy chủ Backend (NestJS + Socket.IO + MQTT Broker + AI Aura)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: chat_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "1884:1884"
      - "8884:8884"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - MONGODB_URI=mongodb://mongo:27017/chatapp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - JWT_SECRET=${JWT_SECRET:-chatapp_jwt_secret_super_key_2026}
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-chatapp_jwt_refresh_secret_super_key_2026}
      - JWT_REFRESH_EXPIRES_IN=30d
      - FRONTEND_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-chatapp-media-703002395048-ap-southeast-2}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-0x4AAAAAAFUR2RRUw7sqoROvHzR6HFexUco}
      - SECRET_KEY_CLOUDFLARE=${SECRET_KEY_CLOUDFLARE:-0x4AAAAAAFUR2RRUw7sqoROvHzR6HFexUco}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-localhost,127.0.0.1,frontend-blush-seven-zqmn2u56h0.vercel.app}
    volumes:
      # Bind Mount source code & configs để kích hoạt Hot Reload lập tức khi sửa file
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      # Anonymous volume bảo toàn node_modules riêng biệt của container Linux
      - /app/node_modules
      - backend_uploads:/app/uploads
      # Nạp chứng chỉ/credentials AWS từ máy host vào container
      - ~/.aws:/root/.aws:ro
    depends_on:
      - mongo
      - redis
    networks:
      - chat_network

  # ============================================================================
  # 3. Giao diện Người dùng Frontend (Next.js 16 + React 19)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    container_name: chat_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-0x4AAAAAAFUR2RRMbBht62MJ}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAAFUR2RRMbBht62MJ}
    volumes:
      # Bind Mount source code & assets để kích hoạt Fast Refresh lập tức
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Anonymous volumes bảo toàn dependencies và cache biên dịch
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - chat_network

  # ============================================================================
  # 4. Giao diện Quản trị viên Admin Portal (React SPA + Vite HMR)
  # ============================================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: dev
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3000}
    container_name: chat_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3000}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-0x4AAAAAAFUR2RRMbBht62MJ}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-0x4AAAAAAFUR2RRMbBht62MJ}
    volumes:
      # Bind Mount source code để kích hoạt Vite HMR lập tức
      - ./admin/src:/app/src
      - ./admin/public:/app/public
      - ./admin/package.json:/app/package.json
      - ./admin/index.html:/app/index.html
      - ./admin/vite.config.ts:/app/vite.config.ts
      # Anonymous volume bảo toàn dependencies
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chat_network

volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  backend_uploads:

networks:
  chat_network:
    driver: bridge
