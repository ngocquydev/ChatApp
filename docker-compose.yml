services:
  # ============================================================================
  # 1. Cơ sở dữ liệu & Bộ nhớ đệm (Databases & Caches)
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: chat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - chat_network

  mongo:
    image: mongo:latest
    container_name: chat_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - chat_network

  neo4j:
    image: neo4j:5-community
    container_name: chat_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    networks:
      - chat_network

  # ============================================================================
  # 2. Máy chủ Backend (NestJS + Socket.IO + AI Aura)
  # ============================================================================
  backend:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
      target: dev
    container_name: chat_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env.local
    environment:
      - PORT=3000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - MONGODB_URI=mongodb://mongo:27017/chatapp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - ADMIN_URL=${ADMIN_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      # Bind Mount source code & configs để kích hoạt Hot Reload lập tức khi sửa file
      - ./apps/server/src:/app/src
      - ./apps/server/package.json:/app/package.json
      - ./apps/server/tsconfig.json:/app/tsconfig.json
      - ./apps/server/tsconfig.build.json:/app/tsconfig.build.json
      - ./apps/server/nest-cli.json:/app/nest-cli.json
      - ./apps/server/certs:/app/certs:ro
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn node_modules riêng biệt của container Linux
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - chat_network

  # ============================================================================
  # 3. Giao diện Người dùng Frontend (Next.js 16 + React 19)
  # ============================================================================
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    container_name: chat_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    env_file:
      - ./.env.local
    environment:
      - PORT=5173
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    volumes:
      # Bind Mount source code & assets để kích hoạt Fast Refresh lập tức
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/package.json:/app/package.json
      - ./apps/web/next.config.mjs:/app/next.config.mjs
      - ./apps/web/tsconfig.json:/app/tsconfig.json
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn dependencies
      - /app/node_modules
    command: ["npx", "next", "dev", "-p", "5173", "--webpack"]
    depends_on:
      - backend
    networks:
      - chat_network

  # ============================================================================
  # 4. Giao diện Quản trị viên Admin Portal (React SPA + Vite HMR)
  # ============================================================================
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: dev
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    container_name: chat_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    env_file:
      - ./.env.local
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    volumes:
      # Bind Mount source code để kích hoạt Vite HMR lập tức
      - ./apps/admin/src:/app/src
      - ./apps/admin/public:/app/public
      - ./apps/admin/package.json:/app/package.json
      - ./apps/admin/index.html:/app/index.html
      - ./apps/admin/vite.config.ts:/app/vite.config.ts
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn dependencies
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chat_network

volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  backend_uploads:

networks:
  chat_network:
    driver: bridge
