services:
  # ============================================================================
  # 1. Cơ sở dữ liệu & Bộ nhớ đệm (Databases & Caches)
  # ============================================================================
  redis:
    image: redis:alpine
    container_name: chat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat_network

  mongo:
    image: mongo:latest
    container_name: chat_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chat_network

  neo4j:
    image: neo4j:5-community
    container_name: chat_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_dev_password_change_me}
    volumes:
      - neo4j_data:/data
    networks:
      - chat_network

  # ============================================================================
  # 2. Máy chủ Backend (NestJS + Socket.IO + MQTT Broker + AI Aura)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: chat_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "1884:1884"
      - "8883:8883"
      - "8884:8884"
    env_file:
      - ./.env.local
    environment:
      - PORT=3000
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - MONGODB_URI=mongodb://mongo:27017/chatapp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_dev_password_change_me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:5174}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
    volumes:
      # Bind Mount source code & configs để kích hoạt Hot Reload lập tức khi sửa file
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/certs:/app/certs:ro
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn node_modules riêng biệt của container Linux
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - chat_network

  # ============================================================================
  # 3. Giao diện Người dùng Frontend (Next.js 16 + React 19)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    container_name: chat_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - ./.env.local
    environment:
      - PORT=5173
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3000}
    volumes:
      # Bind Mount source code & assets để kích hoạt Fast Refresh lập tức
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn dependencies
      - /app/node_modules
    command: ["npx", "next", "dev", "-p", "5173", "--webpack"]
    depends_on:
      - backend
    networks:
      - chat_network

  # ============================================================================
  # 4. Giao diện Quản trị viên Admin Portal (React SPA + Vite HMR)
  # ============================================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: dev
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3000}
    container_name: chat_admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - ./.env.local
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:3000}
    volumes:
      # Bind Mount source code để kích hoạt Vite HMR lập tức
      - ./admin/src:/app/src
      - ./admin/public:/app/public
      - ./admin/package.json:/app/package.json
      - ./admin/index.html:/app/index.html
      - ./admin/vite.config.ts:/app/vite.config.ts
      - ./.env.local:/app/.env.local:ro
      - ./.env.local:/app/.env:ro
      # Anonymous volume bảo toàn dependencies
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chat_network

volumes:
  redis_data:
  mongo_data:
  neo4j_data:
  backend_uploads:

networks:
  chat_network:
    driver: bridge
