<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="auraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="auraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background circle (transparent or dark navy/dark space) -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" />

  <!-- Multi-layered spiral petals like Meta AI -->
  <g transform="translate(50, 50)">
    <!-- Outer ring of tilted rounded petals -->
    <g id="petals">
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(0) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(30) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(60) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(90) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(120) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(150) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(180) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(210) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(240) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(270) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad1)" transform="rotate(300) scale(1, 0.9)" />
      <ellipse cx="0" cy="-28" rx="6.5" ry="14" fill="url(#auraGrad2)" transform="rotate(330) scale(1, 0.9)" />
    </g>

    <!-- Inner core hole giving the ring effect -->
    <circle cx="0" cy="0" r="16" fill="#0f172a" />

    <!-- Center sparkle star -->
    <path d="M 0 -8 Q 0 0 -8 0 Q 0 0 0 8 Q 0 0 8 0 Q 0 0 0 -8 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="2.5" fill="#38bdf8" />
  </g>
</svg>

