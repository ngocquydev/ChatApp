version: '3.8'

services:
  # =========================================================================
  # 1. ZOOKEEPER & APACHE KAFKA (SPEED LAYER MESSAGE BROKER)
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: recommendation-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - recommendation-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recommendation-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - recommendation-net

  # Khởi tạo Kafka Topic tự động
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recommendation-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "sh", "-c" ]
    command: |
      "
      # Chờ Kafka Broker sẵn sàng
      cub kafka-ready -b kafka:29092 1 40
      # Tạo topic friend-events với 3 partition để hỗ trợ xử lý song song
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic friend-events --partitions 3 --replication-factor 1
      echo 'Topic friend-events đã được tạo thành công!'
      "
    networks:
      - recommendation-net

  # =========================================================================
  # 2. REDIS SERVING CACHE (SORTED SET ZSET STORAGE)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: recommendation-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - recommendation-net

  # =========================================================================
  # 3. MONGODB (COLD-START GEOSPATIAL 2DSPHERE & USER PROFILE DATABASE)
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: recommendation-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: chatapp
    networks:
      - recommendation-net

  # =========================================================================
  # 4. APACHE SPARK 3.5 (BATCH LAYER COMPUTATION CLUSTER)
  # =========================================================================
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: recommendation-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080" # Spark Master Web UI
    volumes:
      - ./batch-spark:/opt/spark-app
      - ./data:/opt/spark-data
    networks:
      - recommendation-net

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: recommendation-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081" # Spark Worker Web UI
    volumes:
      - ./batch-spark:/opt/spark-app
      - ./data:/opt/spark-data
    networks:
      - recommendation-net

networks:
  recommendation-net:
    driver: bridge
